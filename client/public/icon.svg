<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Glow Hexagon / Museum Icon -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Museum Columns & Roof Emblem -->
    <path d="M-150,-60 L0,-160 L150,-60 L-150,-60 Z" fill="url(#primaryGrad)" />
    <rect x="-140" y="-55" width="280" height="20" rx="4" fill="#6ee7b7" />
    
    <!-- Columns -->
    <rect x="-120" y="-30" width="30" height="130" rx="6" fill="url(#primaryGrad)" />
    <rect x="-45" y="-30" width="30" height="130" rx="6" fill="url(#primaryGrad)" />
    <rect x="15" y="-30" width="30" height="130" rx="6" fill="url(#primaryGrad)" />
    <rect x="90" y="-30" width="30" height="130" rx="6" fill="url(#primaryGrad)" />

    <!-- Base Plinth -->
    <rect x="-150" y="105" width="300" height="30" rx="6" fill="url(#primaryGrad)" />
    <rect x="-165" y="138" width="330" height="24" rx="6" fill="#047857" />

    <!-- Glowing Coin / Torn Point Center Badge -->
    <circle cx="0" cy="40" r="48" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="6" />
    <text x="0" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#34d399" text-anchor="middle">T</text>
  </g>
</svg>
